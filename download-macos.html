<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arca Private Alpha Download</title>
<meta name="description" content="Download the latest Arca macOS private alpha build.">
<link rel="canonical" href="https://www.witharca.app/download-macos.html">
<link rel="icon" href="/icon.png">
<style>
  :root {
    --paper: #f4efe6;
    --surface: #fdfbf6;
    --ink: #0f1822;
    --text: #1a2532;
    --text-2: #5b6573;
    --accent: #b07a3e;
    --line: rgba(15,24,34,0.10);
    --font: Inter, -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 24px;
    background: var(--paper);
    color: var(--text);
    font-family: var(--font);
  }
  .panel {
    width: min(560px, 100%);
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 28px;
    padding: 36px;
    box-shadow: 0 28px 70px rgba(15,24,34,0.14);
  }
  .wordmark {
    font-size: 13px;
    font-weight: 800;
    letter-spacing: .18em;
    color: var(--accent);
    margin-bottom: 28px;
  }
  h1 { margin: 0 0 10px; font-size: 30px; line-height: 1.12; letter-spacing: 0; }
  p { margin: 0; color: var(--text-2); font-size: 16px; line-height: 1.55; }
  form { margin-top: 28px; }
  label {
    display: block;
    margin-bottom: 8px;
    color: var(--text);
    font-size: 13px;
    font-weight: 800;
    letter-spacing: .12em;
    text-transform: uppercase;
  }
  input {
    width: 100%;
    min-height: 50px;
    padding: 0 16px;
    border: 1px solid var(--line);
    border-radius: 14px;
    background: white;
    color: var(--ink);
    font: 700 16px/1.2 var(--font);
    outline: none;
  }
  input:focus {
    border-color: rgba(176,122,62,0.58);
    box-shadow: 0 0 0 4px rgba(176,122,62,0.12);
  }
  .actions { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 28px; }
  a { color: inherit; }
  .button {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 44px;
    padding: 0 18px;
    border-radius: 12px;
    border: 1px solid var(--line);
    text-decoration: none;
    font-weight: 700;
    font: 700 14px/1 var(--font);
    cursor: pointer;
  }
  .button.primary { background: var(--accent); border-color: var(--accent); color: white; }
  .status { margin-top: 18px; font-size: 13px; color: var(--text-2); }
  .status.error { color: #a3483b; }
  .download-actions { display: none; }
  .download-actions.is-visible { display: flex; }
</style>
</head>
<body>
  <main class="panel">
    <div class="wordmark">ARCA</div>
    <h1>Private alpha download.</h1>
    <p>Arca is currently invite-only. Enter the alpha code you were given and the latest macOS build will start downloading.</p>
    <form id="inviteForm">
      <label for="inviteCode">Invite code</label>
      <input id="inviteCode" name="inviteCode" type="password" autocomplete="off" spellcheck="false" placeholder="Enter alpha code">
      <div class="actions">
        <button class="button primary" type="submit">Unlock Download</button>
        <a class="button" href="/">Back to Arca</a>
      </div>
    </form>
    <div id="downloadActions" class="actions download-actions">
      <a id="downloadLink" class="button primary" href="#">Download Arca.dmg</a>
      <a class="button" href="/">Back to Arca</a>
    </div>
    <div id="downloadStatus" class="status">Private alpha access required.</div>
  </main>

<script>
  const inviteCode = "keystone-quiet-26";
  const fallbackDownloadUrl = "https://github.com/jwaterslynch/arca-releases/releases/download/v0.1.0-beta.24/Arca_0.1.0-beta.24_aarch64.dmg";
  const latestReleaseApiUrl = "https://api.github.com/repos/jwaterslynch/arca-releases/releases/latest";
  const inviteForm = document.getElementById("inviteForm");
  const inviteInput = document.getElementById("inviteCode");
  const downloadActions = document.getElementById("downloadActions");
  const downloadLink = document.getElementById("downloadLink");
  const statusEl = document.getElementById("downloadStatus");
  const alphaSessionKey = "arca-alpha-download-unlocked";

  function normaliseCode(value) {
    return String(value || "").trim().toLowerCase();
  }

  function startDownload(url, label = "Download Arca.dmg") {
    downloadLink.href = url;
    downloadLink.textContent = label;
    statusEl.textContent = "Download starting...";
    window.location.href = url;
  }

  async function resolveLatestDownload() {
    try {
      const res = await fetch(latestReleaseApiUrl, { headers: { Accept: "application/vnd.github+json" } });
      if (!res.ok) throw new Error(`GitHub returned ${res.status}`);
      const release = await res.json();
      const assets = Array.isArray(release.assets) ? release.assets : [];
      const dmg = assets.find(asset => /Arca_.*_aarch64\.dmg$/i.test(asset.name || ""))
        || assets.find(asset => /\.dmg$/i.test(asset.name || ""));
      if (!dmg?.browser_download_url) throw new Error("No macOS DMG asset found on the latest release.");
      startDownload(dmg.browser_download_url, `Download ${dmg.name || "Arca.dmg"}`);
    } catch (err) {
      statusEl.textContent = "Could not resolve the latest build automatically. Using the current macOS build.";
      startDownload(fallbackDownloadUrl);
    }
  }

  function unlockDownload() {
    inviteForm.style.display = "none";
    downloadActions.classList.add("is-visible");
    statusEl.classList.remove("error");
    statusEl.textContent = "Finding the latest macOS build...";
    sessionStorage.setItem(alphaSessionKey, "1");
    resolveLatestDownload();
  }

  inviteForm.addEventListener("submit", event => {
    event.preventDefault();
    if (normaliseCode(inviteInput.value) === inviteCode) {
      unlockDownload();
      return;
    }
    statusEl.classList.add("error");
    statusEl.textContent = "That invite code did not work. Check the code and try again.";
    inviteInput.select();
  });

  if (sessionStorage.getItem(alphaSessionKey) === "1") {
    unlockDownload();
  } else {
    inviteInput.focus();
  }
</script>
</body>
</html>
